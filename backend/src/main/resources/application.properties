server.port=8080
spring.application.name=haatbodol-backend

# Multipart File Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# HaatBodol MySQL Configuration (used alongside GoF Singleton DatabasePool)
haatbodol.db.host=${DB_HOST:127.0.0.1}
haatbodol.db.port=${DB_PORT:3306}
haatbodol.db.user=${DB_USER:root}
haatbodol.db.password=${DB_PASSWORD:}
haatbodol.db.name=${DB_NAME:haatbodol_db}

# Security & Uploads
haatbodol.jwt.secret=${JWT_SECRET:haatbodol_super_secret_university_key_2026}
haatbodol.upload.dir=${UPLOAD_DIR:../public/uploads/listings}
